# podman-compose.yml
# Chạy: podman-compose up -d
# Dừng: podman-compose down
# Xem log: podman-compose logs -f <service-name>
# Build lại app: podman-compose build app
#
# LƯU Ý PODMAN:
# - Podman mặc định rootless, port < 1024 cần config riêng (1521/6379/8080 đều OK)
# - Volume mount với SELinux trên Linux có thể cần thêm ":Z" (ví dụ ./data:/data:Z)
# - Network giữa các container dùng tên service làm hostname (oracle-free, redis)
# - Service "app" mặc định comment OUT khi học để chạy app từ IDE (hot-reload).
#   Bật khi muốn full-stack test trong container hoặc deploy demo.

version: "3.8"

services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: identity-oracle
    ports:
      - "1521:1521"
      - "5500:5500"        # Enterprise Manager Express, có thể bỏ nếu không dùng
    environment:
      ORACLE_PWD: "Oracle_123456"
      ORACLE_CHARACTERSET: "AL32UTF8"
    volumes:
      - oracle-free-data:/opt/oracle/oradata
      # init.sql chạy 1 lần đầu tiên khi container khởi tạo DB lần đầu.
      # Dùng để tạo user "identity" và grant quyền.
      - ./docker/oracle/init.sql:/opt/oracle/scripts/startup/01-init.sql:ro,z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM dual;' | sqlplus -s system/Oracle_123456@localhost:1521/FREEPDB1 | grep -q 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m   # Oracle khởi động lần đầu mất 3-8 phút, ĐỪNG hoảng
    restart: unless-stopped
    networks:
      - identity-net

  redis:
    image: docker.io/library/redis:8.6.3
    container_name: identity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - identity-net

  # App service — build từ Dockerfile cùng repo.
  # Bỏ profile khỏi env list khi dev (để chạy từ IDE thay vì container).
  # Bật service này khi muốn smoke test full-stack: podman-compose up -d --build app
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: identity-service:latest
    container_name: identity-app
    depends_on:
      oracle-free:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Profile prod → đòi hết env var dưới phải set tường minh, không có default
      SPRING_PROFILES_ACTIVE: prod
      # JDBC URL dùng SERVICE NAME làm host (không phải localhost vì cùng pod/network!)
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@oracle-free:1521/FREEPDB1"
      SPRING_DATASOURCE_USERNAME: identity
      SPRING_DATASOURCE_PASSWORD: identity123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ""
      # JWT_SECRET: BẮT BUỘC set qua env file hoặc shell. KHÔNG hard-code ở đây.
      # Tạo file .env cùng folder: JWT_SECRET=<base64-48-bytes>
      JWT_SECRET: ${JWT_SECRET}
      # GeoIP: tạm cho phép thiếu để smoke test mà không cần tải .mmdb trước.
      # Production thật phải set false + mount file thật vào /var/lib/identity/geoip.
      GEOIP_FAIL_ON_MISSING: "false"
      GEOIP_DATABASE_PATH: /var/lib/identity/geoip/GeoLite2-City.mmdb
    volumes:
      # Mount thư mục geoip (rỗng cũng được nếu FAIL_ON_MISSING=false)
      - ./docker/geoip:/var/lib/identity/geoip:ro,z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - identity-net

networks:
  identity-net:
    driver: bridge

volumes:
  oracle-free-data:
  redis-data:

# podman-compose.yml
# Chạy: podman-compose up -d
# Dừng: podman-compose down
# Xem log: podman-compose logs -f <service-name>
#
# LƯU Ý PODMAN:
# - Podman mặc định rootless, port < 1024 cần config riêng (1521/6379/8080 đều OK)
# - Volume mount với SELinux trên Linux có thể cần thêm ":Z" (ví dụ ./data:/data:Z)
# - Network giữa các container dùng tên service làm hostname (oracle-free, redis)

version: "3.8"

services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: identity-oracle
    ports:
      - "1521:1521"
      - "5500:5500"        # Enterprise Manager Express, có thể bỏ nếu không dùng
    environment:
      ORACLE_PWD: "Oracle_123456"
      ORACLE_CHARACTERSET: "AL32UTF8"
    volumes:
      - oracle-free-data:/opt/oracle/oradata
      # init.sql chạy 1 lần đầu tiên khi container khởi tạo DB lần đầu.
      # Dùng để tạo user "identity" và grant quyền.
      - ./docker/oracle/init.sql:/opt/oracle/scripts/startup/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM dual;' | sqlplus -s system/Oracle_123456@localhost:1521/FREEPDB1 | grep -q 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m   # Oracle khởi động lần đầu mất 3-8 phút, ĐỪNG hoảng
    restart: unless-stopped
    networks:
      - identity-net

  redis:
    image: docker.io/library/redis:8.6.3
    container_name: identity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - identity-net

  # App service - bỏ comment khi bạn đã có Dockerfile và muốn chạy cả app trong container.
  # Giai đoạn dev nên chạy app từ IDE để hot-reload, chỉ chạy oracle + redis trong podman.
  #
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: identity-app
  #   depends_on:
  #     oracle-free:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: docker
  #     # JDBC URL dùng service name làm host (không phải localhost!)
  #     SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@oracle-free:1521/FREEPDB1"
  #     SPRING_DATASOURCE_USERNAME: identity
  #     SPRING_DATASOURCE_PASSWORD: identity123
  #     SPRING_DATA_REDIS_HOST: redis
  #     SPRING_DATA_REDIS_PORT: 6379
  #   restart: unless-stopped
  #   networks:
  #     - identity-net

networks:
  identity-net:
    driver: bridge

volumes:
  oracle-free-data:
  redis-data:

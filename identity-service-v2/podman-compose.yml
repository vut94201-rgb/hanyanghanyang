  #   volumes:
  #     - ./docker/geoip:/var/lib/identity/geoip:ro,z
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 60s
  #   restart: unless-stopped
  #   networks:

# podman-compose.yml
# =============================================================================
# Setup mặc định: CHỈ chạy Oracle + Redis dưới dạng container.
# App chạy từ IDE / mvn ở host machine (port 8080) - cho hot-reload.
#
# Lệnh thường dùng:
#   podman-compose up -d                    Khởi Oracle + Redis (lần đầu Oracle mất 5-10 phút)
#   podman-compose down                     Dừng + xoá container (giữ volume)
#   podman-compose down -v                  Dừng + xoá CẢ volume (mất data Oracle)
#   podman-compose logs -f oracle-free      Theo dõi log Oracle khi khởi tạo
#   podman-compose logs -f redis            Theo dõi Redis
#
# Khi cần test full stack (app cũng chạy trong container):
#   1) Uncomment service "app" ở dưới (xoá dấu # đầu mỗi dòng từ "app:" xuống "- identity-net" cuối block)
#   2) Tạo file .env cùng folder với JWT_SECRET (xem .env.example)
#   3) DỪNG app đang chạy ở IDE (tránh port 8080 conflict)
#   4) Chạy: podman-compose up -d --build app
#
# LƯU Ý PODMAN:
# - Podman rootless mặc định, port < 1024 cần config riêng (1521/6379/8080 đều OK)
# - Volume mount với SELinux trên Linux cần ":Z" (đã có sẵn trong file)
# - Network giữa container dùng tên service làm hostname (oracle-free, redis)
# - Image short-name có thể cần FQIN (docker.io/library/...) trên Podman rootless
# =============================================================================

version: "3.8"

services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: identity-oracle
    ports:
      - "1521:1521"
      - "5500:5500"        # Enterprise Manager Express, có thể bỏ nếu không dùng
    environment:
      ORACLE_PWD: "Oracle_123456"
      ORACLE_CHARACTERSET: "AL32UTF8"
    volumes:
      - oracle-free-data:/opt/oracle/oradata
      # init.sql chạy 1 lần đầu tiên khi container khởi tạo DB lần đầu.
      # Dùng để tạo user "identity" và grant quyền.
      - ./docker/oracle/init.sql:/opt/oracle/scripts/startup/01-init.sql:ro,z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'SELECT 1 FROM dual;' | sqlplus -s system/Oracle_123456@localhost:1521/FREEPDB1 | grep -q 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m   # Oracle khởi động lần đầu mất 3-8 phút, ĐỪNG hoảng
    restart: unless-stopped
    networks:
      - identity-net

  redis:
    image: docker.io/library/redis:8.6.3
    container_name: identity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - identity-net

  # ===========================================================================
  # App service — COMMENT OUT mặc định để dev chạy app từ IDE/mvn.
  # Uncomment khi muốn full-stack test trong container hoặc deploy demo.
  #
  # Trước khi uncomment:
  #   - Phải có file .env cùng folder với:  JWT_SECRET=<openssl rand -base64 48>
  #   - Phải DỪNG app đang chạy ở host (port 8080 conflict)
  #   - Lần đầu sẽ build image: podman-compose up -d --build app
  # ===========================================================================
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: identity-service:latest
  #   container_name: identity-app
  #   depends_on:
  #     oracle-free:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     # Profile prod → đòi hết env var dưới phải set tường minh, không có default
  #     SPRING_PROFILES_ACTIVE: prod
  #     # JDBC URL dùng SERVICE NAME làm host (không phải localhost vì cùng pod/network!)
  #     SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@oracle-free:1521/FREEPDB1"
  #     SPRING_DATASOURCE_USERNAME: identity
  #     SPRING_DATASOURCE_PASSWORD: identity123
  #     SPRING_DATA_REDIS_HOST: redis
  #     SPRING_DATA_REDIS_PORT: "6379"
  #     SPRING_DATA_REDIS_PASSWORD: ""
  #     # JWT_SECRET đọc từ file .env (cùng folder với compose). KHÔNG hard-code.
  #     JWT_SECRET: ${JWT_SECRET}
  #     # GeoIP: tạm cho phép thiếu để smoke test mà không cần tải .mmdb trước.
  #     # Production thật phải set false + mount file thật vào /var/lib/identity/geoip.
  #     GEOIP_FAIL_ON_MISSING: "false"

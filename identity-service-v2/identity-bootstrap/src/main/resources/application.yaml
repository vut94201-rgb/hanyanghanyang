# =============================================================================
# application.yml - cấu hình MẶC ĐỊNH (production-leaning)
# =============================================================================
# File này chứa các giá trị an toàn-mặc-định. Mọi secret và giá trị môi trường
# cụ thể đọc từ ENV VAR (cú pháp ${VAR:default}).
#
# Profile dev override file này bằng application-dev.yml.
# Profile prod override file này bằng application-prod.yml.
# Khi không set spring.profiles.active, mặc định KHÔNG có profile - tức là
# app sẽ ĐÒI các env var bắt buộc (JWT_SECRET, v.v.) trước khi start.
# =============================================================================

spring:
  application:
    name: identity-service

  # ---- Datasource: Oracle Free 23 trên port 1521, PDB tên FREEPDB1 ----
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:identity}
    password: ${SPRING_DATASOURCE_PASSWORD:identity123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # Pool size hợp lý cho fresher demo. Production có thể bump lên.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: identity-hikari-pool

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      # CỰC KỲ QUAN TRỌNG: validate, KHÔNG dùng update/create-drop.
      # Schema được quản lý 100% bởi Flyway, Hibernate chỉ check entity có khớp DB không.
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP

        # KHÔNG set hibernate.dialect tường minh — Hibernate 6 tự detect
        # OracleDialect từ JDBC URL "jdbc:oracle:*". Set tay sẽ warn:
        # "OracleDialect does not need to be specified explicitly".
        # Format SQL khi log (dev). Production tắt qua application-prod.yml.
        format_sql: true
        # Batch insert/update hoạt động với sequence allocationSize=50
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false   # KHÔNG để OSIV - tránh lazy loading "vô hình" trong controller

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ---- Redis ----
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0

# ---- Server ----
server:
  port: ${SERVER_PORT:8080}
  web:
      error:
        # KHÔNG lộ stacktrace ra response - GlobalExceptionHandler tự format error
        include-message: never
        include-stacktrace: never
        include-binding-errors: never

# ---- Cấu hình ứng dụng (custom) ----
# Đặt dưới namespace "app.*" để gom toàn bộ config riêng của Identity Service.
# Sẽ map sang @ConfigurationProperties("app.jwt"), @ConfigurationProperties("app.geoip"), v.v.
app:
  jwt:
    # Secret PHẢI là Base64-encoded chuỗi >= 256 bit. Dev override trong application-dev.yml.
    # Production: BẮT BUỘC set qua env, không có default.
    secret: ${JWT_SECRET}
    issuer: identity-service
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

  geoip:
    # Đường dẫn tới GeoLite2-City.mmdb. Mặc định trỏ tới docker/geoip nếu chạy local.
    database-path: ${GEOIP_DATABASE_PATH:./docker/geoip/GeoLite2-City.mmdb}
    # Nếu false, GeoLocationResolver sẽ return EMPTY thay vì throw - tiện khi
    # chưa kịp tải file .mmdb về.
    fail-on-missing-database: ${GEOIP_FAIL_ON_MISSING:false}

  # ---- Rate Limit (Bucket4j + Redis) ----
  # Áp dụng cho 3 endpoint public: /login, /register, /refresh.
  # Key:
  #   - login + register: IP client (sau khi resolve qua X-Forwarded-For nếu có proxy)
  #   - refresh: fallback IP (TODO: nâng cấp dùng token-hash prefix)
  # Dev: giá trị "thoải mái" để dev test thoải mái, không bị block khi reload UI.
  # Production: override trong application-prod.yml chặt hơn.
  rate-limit:
    enabled: true
    login:
      short-window-capacity: 5
      short-window-duration: 1m
      long-window-capacity: 20
      long-window-duration: 1h
    register:
      short-window-capacity: 3
      short-window-duration: 1m
      long-window-capacity: 10
      long-window-duration: 1h
    refresh:
      short-window-capacity: 10
      short-window-duration: 1m
      long-window-capacity: 100
      long-window-duration: 1h

# ---- springdoc OpenAPI (Swagger UI) ----
# Default profile + dev: bật. Prod profile override = false.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# =============================================================================
# Actuator + Metrics + Tracing (Step L1)
# =============================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus, metrics, loggers
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        identity.auth.login.duration.seconds: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 1m
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3

# ---- Logging ----
logging:
  level:
    root: INFO
    com.personal.identity: DEBUG
    # Tắt log "verbose" của Hibernate; bật tạm khi cần debug query.
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
